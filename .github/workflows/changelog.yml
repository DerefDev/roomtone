# After each release, rewrites CHANGELOG.md from the release notes on GitHub and commits it to main.
name: Changelog

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

# publishing a release sends both "published" and "edited": run one at a time, the second finds nothing to change
concurrency:
  group: changelog

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # serve la storia completa per unire main in staging
      - run: tools/releases.py changelog && tools/releases.py fastlane
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          git add CHANGELOG.md fastlane
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the changelog from the release notes"
          git push
      # staging riceve lo stesso commit, così i due branch restano allineati senza passaggi a mano
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git switch staging
          git merge --ff-only origin/main 2>/dev/null || git merge --no-edit main || { git merge --abort; echo "::warning::staging not updated: merge main into staging by hand"; exit 0; }
          git push origin staging
