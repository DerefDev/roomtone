# After each release, rewrites CHANGELOG.md from the release notes on GitHub and commits it to main.
name: Changelog

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

# publishing a release sends both "published" and "edited": run one at a time, the second finds nothing to change
concurrency:
  group: changelog

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - run: tools/releases.py changelog
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          git diff --quiet CHANGELOG.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the changelog from the release notes" CHANGELOG.md
          git push
