# On a v* tag: runs the tests, builds the signed APK and creates a draft release with notes generated from the merged PRs.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Keys and keystore
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          DISCOGS_CONSUMER_KEY: ${{ secrets.DISCOGS_CONSUMER_KEY }}
          DISCOGS_CONSUMER_SECRET: ${{ secrets.DISCOGS_CONSUMER_SECRET }}
          GENIUS_ACCESS_TOKEN: ${{ secrets.GENIUS_ACCESS_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          for k in LASTFM_API_KEY LASTFM_API_SECRET DISCOGS_CONSUMER_KEY DISCOGS_CONSUMER_SECRET GENIUS_ACCESS_TOKEN; do
            test -n "${!k}" || { echo "::error::missing secret $k"; exit 1; }
            echo "$k=${!k}" >> secrets.properties
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" || { echo "::error::missing secret KEYSTORE_BASE64"; exit 1; }
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::missing secret KEYSTORE_PASSWORD"; exit 1; }
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="roomtone-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --draft --verify-tag --generate-notes --title "Roomtone ${GITHUB_REF_NAME#v}"
