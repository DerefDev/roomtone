# Builds the website and publishes it on GitHub Pages, following Zensical's guide
# (https://zensical.org/docs/publish-your-site/), plus two generated pages: the home page from
# README.md and "Latest release" from the latest GitHub release.
# Repository setting needed: Settings → Pages → Source: GitHub Actions.
name: Site

on:
  push:
    branches: [main]
    paths: [README.md, docs/**, mkdocs.yml, tools/site-index.sh, tools/releases.py, .github/workflows/site.yml]
  # after a release, via the changelog workflow: it runs on main, the only ref allowed to deploy to Pages
  workflow_run:
    workflows: [Changelog]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      # versions pinned: Zensical is young and may change between releases
      - run: pip install zensical==0.1.3 markdown-callouts==0.4.0
      - run: tools/site-index.sh && tools/releases.py page
        env:
          GH_TOKEN: ${{ github.token }}
      - run: zensical build --clean -f mkdocs.yml
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
